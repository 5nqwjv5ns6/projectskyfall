      if(!txt&&!ctl){var cs=getComputedStyle(el),bg=cs.backgroundColor;
        if(!((bg&&bg!=='transparent'&&!/rgba\([^)]*,\s*0\)$/.test(bg))||cs.backgroundImage!=='none'||cs.borderTopWidth!=='0px')) continue}
      if(!shown(el)) continue;
      out.push(r);
    }
    return out;
  }
  function cover(x,y,R){var s=0;for(var i=0;i<R.length;i++){var r=R[i],w=Math.min(x+SZ,r.right)-Math.max(x,r.left),h=Math.min(y+SZ,r.bottom)-Math.max(y,r.top);if(w>0&&h>0)s+=w*h}return s}
  function place(){
    if(!box) return;
    var W=innerWidth,H=innerHeight,C={},R=uiRects(W,H),c=function(k,x,y){C[k]=[Math.min(Math.max(8,x),W-SZ-8),Math.min(Math.max(8,y),H-SZ-8)]};
    var p=document.getElementById('radio'),b=p&&p.getBoundingClientRect();
    if(b&&b.width){c('pill',b.right-SZ,b.top>H/2?b.top-SZ-10:b.bottom+10);c('pillL',b.left-SZ-10,b.top+b.height/2-SZ/2)}
    c('tl',M,M);c('tr',W-SZ-M,M);c('bl',M,H-SZ-M);c('br',W-SZ-M,H-SZ-M);
    c('ml',M,(H-SZ)/2);c('mr',W-SZ-M,(H-SZ)/2);c('tc',(W-SZ)/2,M);c('bc',(W-SZ)/2,H-SZ-M);
    var best='',bs=1e18,order=['pill','pillL','br','bl','tr','tl','mr','ml','bc','tc'];
    for(var i=0;i<order.length;i++){var k=order[i];if(!C[k])continue;var v=cover(C[k][0],C[k][1],R)+i*40;if(v<bs){bs=v;best=k}}
    // stay put unless the move clearly helps, so the player does not hop around as HUD numbers change
    if(spot&&C[spot]&&spot!==best){var cur=cover(C[spot][0],C[spot][1],R)+order.indexOf(spot)*40;if(cur-bs<1500)best=spot}
    spot=best; var q=C[best]; if(!q) return;
    box.style.left=q[0]+'px'; box.style.top=q[1]+'px'; box.style.bottom='auto';
  }
  // re-check when the screen changes (game state, window size); while flying the HUD layout is fixed, so the
  // DOM is only scanned once per state change and then every few seconds, never per frame
  var lastSt='', lastScan=0;
  setInterval(function(){
    if(!box||box.classList.contains('off')) return;
    var g=window.__game, st=g?g.state+(g.paused?'p':''):'', now=Date.now();
    if(st!==lastSt||now-lastScan>(st==='fly'?6000:1500)){lastSt=st;lastScan=now;place()}
  },250);
  addEventListener('resize',function(){box&&!box.classList.contains('off')&&place()});
  function show(){place();box&&box.classList.remove('off')}
  function hide(){box&&box.classList.add('off')}
  function vol(){var R=window.__radio;if(!yt||!R||!yt.setVolume)return;var v=Math.round(Math.min(1,(R.vol==null?.7:R.vol)*(R.ducked?.3:1))*100);if(v!==wantVol){wantVol=v;try{yt.setVolume(v)}catch(e){}}}
  function ytPause(){clearTimeout(wd);try{yt&&yt.pauseVideo&&yt.pauseVideo()}catch(e){}box&&box.classList.remove('tap');hide()}

  function install(R){
    if(R.__yt) return; R.__yt=true;
    var O={play:R.play.bind(R),pause:R.pause.bind(R),setVol:R.setVol.bind(R),duck:R.duck.bind(R)};
    R.loaded=false; R.list=[];
    R.load=async function(){
      if(!this.__ytLoaded){this.__ytLoaded=true;this.loaded=true;
        var local=this.list.filter(function(t){return !t.yt});
        this.list=LIST.map(function(x){return {file:'yt:'+x[0],title:x[1],yt:x[0]}}).concat(local);
        this.arrange();}
      return this.list.length;
    };
    var seq=0;
    R.play=async function(){
      var my=++seq;
      await this.load();
      var t=this.track;
      if(!t||!t.yt){ytPause();return O.play()}
      try{this.a&&this.a.pause()}catch(e){}
      this.on=true; this.cur=t; this.show();
      await api(); if(my!==seq) return;              // a newer play/next came in while the API loaded
      show(); box.classList.remove('tap'); clearTimeout(hideT);
      try{
        // one player for the whole session: the next song loads inside it, so a browser that needed one tap keeps the
        // sound; a stuck or failed player is replaced (watchdog), with the stuck-on-logo case covered there
        if(!yt||broken||st()===-9){await create(t.yt);if(my!==seq)return}
        else if(curId!==t.yt){curId=t.yt;loadT=Date.now();playedId='';yt.loadVideoById(t.yt)}
        else if(st()!==1) yt.playVideo();
      }catch(e){broken=true}
      vol(); watch(t.yt);
    };
    R.pause=function(){ if(curIsYT()){seq++;this.on=false;ytPause();this.show()} else O.pause() };
    R.next=function(){ if(!this.list.length) return this.play(); this.i=(this.i+1)%this.list.length; this.cur=null;
      if(this.on) this.play(); else { if(curIsYT()) curId=''; this.show() } };
    R.prev=function(){ if(!this.list.length) return this.play(); this.i=(this.i-1+this.list.length)%this.list.length; this.cur=null;
      if(this.on) this.play(); else { if(curIsYT()) curId=''; this.show() } };
    R.setVol=function(v){O.setVol(v);vol()};
    R.duck=function(e){O.duck(e);vol()};
  }
  (function wait(n){var R=window.__radio;if(R&&R.play&&R.arrange){install(R)}else if(n<600){setTimeout(function(){wait(n+1)},100)}})(0);
})();
</script>
